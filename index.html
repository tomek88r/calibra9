    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrqGil-2FYCLxt5uwpffaCDXS88I4uKuI",
            authDomain: "calibra-3153f.firebaseapp.com",
            databaseURL: "https://calibra-3153f-default-rtdb.firebaseio.com",
            projectId: "calibra-3153f",
            storageBucket: "calibra-3153f.firebasestorage.app",
            messagingSenderId: "29752828059",
            appId: "1:29752828059:web:efe4b411c503c23c97e63e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const equipmentRef = ref(db, "equipmentList");
        const lastUpdatedRef = ref(db, "lastUpdated");

        function updateLastUpdated() {
            const now = new Date();
            const formatted = now.toLocaleString('pl-PL', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
            set(lastUpdatedRef, { timestamp: now.getTime(), formatted: formatted }).catch(console.error);
        }

        function saveToFirebase() {
            if (typeof window.getEquipmentList === 'function') {
                const data = window.getEquipmentList();
                set(equipmentRef, data).then(() => updateLastUpdated()).catch(console.error);
            }
        }

        function clearFirebase() {
            remove(equipmentRef).then(() => {
                if (typeof window.clearLocalEquipmentList === 'function') window.clearLocalEquipmentList();
                updateLastUpdated();
                if (typeof window.showStatus === 'function') window.showStatus('Wszystkie dane usunięte', 'success');
            }).catch(console.error);
        }

        onValue(lastUpdatedRef, (snapshot) => {
            if (snapshot.exists()) {
                document.getElementById('last-updated-time').textContent = snapshot.val().formatted;
            } else updateLastUpdated();
        });

        onValue(equipmentRef, (snapshot) => {
            if (snapshot.exists()) {
                let data = snapshot.val();
                let newList = Array.isArray(data) ? data : Object.values(data);
                newList.forEach(item => {
                    if (item.calibrationValidity) {
                        const valDate = new Date(item.calibrationValidity);
                        const today = new Date();
                        today.setHours(0,0,0,0);
                        valDate.setHours(0,0,0,0);
                        item.daysToExpiry = Math.ceil((valDate.getTime() - today.getTime()) / (1000*3600*24));
                    }
                });
                if (typeof window.updateEquipmentListFromFirebase === 'function') window.updateEquipmentListFromFirebase(newList);
            } else if (typeof window.clearLocalEquipmentList === 'function') window.clearLocalEquipmentList();
        });

        if (window.setFirebaseFunctions && typeof window.setFirebaseFunctions === 'function') {
            window.setFirebaseFunctions(saveToFirebase, clearFirebase, updateLastUpdated);
        }
    </script>
</body>
